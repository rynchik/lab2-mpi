name: Lab 2 checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check src tests scripts
      - run: python -m flake8 src tests scripts --max-line-length=120
      - run: python -m mypy src --ignore-missing-imports
      - run: python -m pytest -q

